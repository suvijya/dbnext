name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  unit:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run

  e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dbnext-e2e
          key: e2e-clones-${{ hashFiles('test/e2e/repos.ts') }}
      - run: npm run test:e2e
        env:
          DBNEXT_E2E_CACHE: ${{ runner.temp }}/dbnext-e2e
